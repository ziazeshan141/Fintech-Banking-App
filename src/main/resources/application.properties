spring.jpa.hibernate.ddl-auto=update

# Database Connection (Fixed protocol scheme and host for containerized environment)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-service:3306/Fintech_Finance_Database?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:zeshan123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Server Attributes (Binds to 0.0.0.0 so Kubernetes/ELB can reach it)
server.port=8076

# Disable Default Error Page
server.error.whitelabel.enabled=false

# Mail Config
spring.mail.username=ziazeshan141@gmail.com
spring.mail.password=zeshan123
spring.mail.host=smtp.gmail.com
spring.mail.port=587
